[package]
name = "mcpg-plugin-identity-basic"
version = "0.1.0-alpha.20"
license = "Apache-2.0"
edition = "2024"
description = "HTTP Basic auth identity plugin for MCPG gateway (dev.mcpg.identity.basic)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
async-trait = "0.1"
base64 = "0.22"
metrics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "macros", "serde"] }
tracing = "0.1"

# Password hashing — argon2 covers the modern recommendation,
# bcrypt covers htpasswd-migrated deployments. Both pure-Rust.
argon2 = "0.5"
bcrypt = "0.16"
password-hash = "0.5"

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's `declare_identity_plugin!` `build_static`
# accessor (gated `#[cfg(feature = "static-firstparty")]`) does not
# trigger `unexpected_cfgs` in consumer compilation. Empty: this plugin
# is consumed as a cdylib, not via the static-firstparty fast path.
static-firstparty = []
